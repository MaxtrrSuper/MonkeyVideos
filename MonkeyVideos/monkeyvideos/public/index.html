<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MonkeyVideos 🐵</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: #1a1a2e; color: white; font-family: Arial; }
        .header { position: fixed; top: 0; left: 0; right: 0; padding: 15px; background: rgba(26,26,46,0.9); z-index: 100; display: flex; justify-content: space-between; }
        .logo { font-size: 20px; font-weight: bold; }
        .logo span { color: #ff6b35; }
        .header-actions { display: flex; gap: 10px; }
        .header-actions button { width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(255,255,255,0.1); color: white; font-size: 18px; cursor: pointer; }
        .video-feed { position: relative; width: 100%; height: 100%; }
        .video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: transform 0.3s; }
        .video-wrapper { position: relative; width: 100%; height: 100%; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .actions { position: absolute; right: 16px; bottom: 100px; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
        .action-btn { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .action-icon { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .info { position: absolute; bottom: 30px; left: 16px; right: 80px; z-index: 10; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ff6b35; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 8px; }
        .username { font-weight: bold; font-size: 16px; }
        .description { font-size: 14px; margin-top: 8px; }
        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; background: #ff6b35; color: white; border-radius: 8px; z-index: 999; }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 200; }
        .modal-content { background: #1a1a2e; padding: 24px; border-radius: 16px; width: 90%; max-width: 400px; }
        .form-group { margin-bottom: 12px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white; }
        .submit-btn { width: 100%; padding: 12px; background: #ff6b35; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .close-modal { position: absolute; top: 10px; right: 10px; background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">🐵 Monkey<span>Videos</span></div>
        <div class="header-actions">
            <button onclick="openUpload()" title="Загрузить">➕</button>
            <button onclick="openAdmin()" title="Админ">⚙️</button>
        </div>
    </header>
    <main class="video-feed" id="feed"></main>
    <div id="toastContainer"></div>
    
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeUpload()">✕</button>
            <h3>Загрузить видео</h3>
            <form id="uploadForm">
                <div class="form-group"><input type="file" id="videoFile" accept="video/*"></div>
                <div class="form-group"><input type="text" id="userName" placeholder="Ваше имя"></div>
                <div class="form-group"><textarea id="videoDesc" placeholder="Описание"></textarea></div>
                <button type="submit" class="submit-btn">Загрузить 🚀</button>
            </form>
        </div>
    </div>

    <script>
        let currentIndex = 0;
        let videos = [];
        let startY = 0;

        async function loadVideos() {
            const res = await fetch('/api/videos');
            const data = await res.json();
            videos = data.data || [];
            renderVideos();
            if (videos.length > 0) playVideo(0);
        }

        function renderVideos() {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            videos.forEach((v, i) => {
                const el = document.createElement('div');
                el.className = 'video-container';
                el.style.transform = `translateY(${i * 100}%)`;
                el.innerHTML = `
                    <div class="video-wrapper"><video src="${v.url}" loop muted playsinline></video></div>
                    <div class="actions">
                        <div class="action-btn" onclick="likeVideo(${v.id})">
                            <div class="action-icon">❤️</div>
                            <span>${formatCount(v.likes || 0)}</span>
                        </div>
                    </div>
                    <div class="info">
                        <span class="avatar">${v.avatar || '🐵'}</span>
                        <span class="username">${v.user || '@user'}</span>
                        <div class="description">${v.description || ''}</div>
                    </div>
                `;
                feed.appendChild(el);
            });
        }

        function playVideo(i) {
            currentIndex = i;
            document.querySelectorAll('video').forEach((v, idx) => {
                if (idx === i) v.play().catch(() => {});
                else v.pause();
            });
        }

        function switchVideo(i) {
            if (i < 0 || i >= videos.length) return;
            currentIndex = i;
            document.querySelectorAll('.video-container').forEach((c, idx) => {
                c.style.transform = `translateY(${(idx - i) * 100}%)`;
            });
            setTimeout(() => playVideo(i), 300);
        }

        async function likeVideo(id) {
            const res = await fetch(`/api/videos/${id}/like`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: 'user' })
            });
            const data = await res.json();
            if (data.success) {
                const btn = document.querySelector(`.video-container:nth-child(${currentIndex + 1}) .action-btn span`);
                if (btn) btn.textContent = formatCount(data.data.likes);
            }
        }

        function formatCount(n) {
            if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n/1000).toFixed(1) + 'K';
            return n || '0';
        }

        function openUpload() { document.getElementById('uploadModal').style.display = 'flex'; }
        function closeUpload() { document.getElementById('uploadModal').style.display = 'none'; }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('videoFile').files[0];
            const user = document.getElementById('userName').value || 'anonymous';
            const desc = document.getElementById('videoDesc').value;
            
            if (!file) return alert('Выберите файл');
            
            const formData = new FormData();
            formData.append('video', file);
            formData.append('user', user);
            formData.append('description', desc);
            
            const res = await fetch('/api/videos/upload', { method: 'POST', body: formData });
            const data = await res.json();
            
            if (data.success) {
                closeUpload();
                loadVideos();
                showToast('Видео загружено! 🎉');
            }
        });

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        async function openAdmin() {
            const token = prompt('Админ-токен:');
            if (!token) return;
            
            const res = await fetch(`/api/admin/stats?token=${token}`);
            const data = await res.json();
            
            if (data.success) {
                alert(`Видео: ${data.data.totalVideos.count}\nПользователей: ${data.data.totalUsers.count}\nЛайков: ${data.data.totalLikes.count}`);
                
                const action = prompt('Создать ивент? (название / нет)');
                if (action && action !== 'нет') {
                    await fetch('/api/events/admin/create', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'admin-token': token },
                        body: JSON.stringify({ title: action, description: 'Новый ивент!' })
                    });
                    showToast('Ивент создан! 🎉');
                }
            } else {
                showToast('Неверный токен');
            }
        }

        // Свайпы
        document.addEventListener('touchstart', e => { startY = e.touches[0].clientY; });
        document.addEventListener('touchend', e => {
            const diff = e.changedTouches[0].clientY - startY;
            if (Math.abs(diff) > 50) {
                diff < 0 ? switchVideo(currentIndex + 1) : switchVideo(currentIndex - 1);
            }
        });
        
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp') switchVideo(currentIndex - 1);
            if (e.key === 'ArrowDown') switchVideo(currentIndex + 1);
        });

        loadVideos();
    </script>
</body>
</html>
